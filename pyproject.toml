[project]
name = "quotapilot"
version = "0.1.0"
description = "Local usage-management and model-routing assistant for subscription-based AI coding tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "aiosqlite>=0.20",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "pyside6>=6.8,<7",
]

[project.scripts]
quotapilot = "quotapilot.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotapilot"]

[tool.hatch.build.targets.wheel.force-include]
"policies/model_profiles" = "quotapilot/_data/model_profiles"
"calibration/scenarios.yaml" = "quotapilot/_data/calibration/scenarios.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/policies",
    "/calibration",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
