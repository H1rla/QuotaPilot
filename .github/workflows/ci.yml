name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        run: uv run pytest

      - name: CLI smoke test
        run: |
          uv run quotapilot --version
          uv run quotapilot --help
          uv run quotapilot config validate --json
          uv run quotapilot calibrate evaluate --json

      - name: Build wheel and source distribution
        run: uv build

      - name: Installed-wheel smoke test
        run: |
          uv venv "$RUNNER_TEMP/quotapilot-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/quotapilot" --version
          "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/quotapilot" --help
          "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/quotapilot" config validate --json
          "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/python" -c "from quotapilot.capabilities import ModelProfileRegistry, default_profile_directory; ModelProfileRegistry.from_directory(default_profile_directory())"
          "$RUNNER_TEMP/quotapilot-wheel-smoke/bin/quotapilot" calibrate evaluate --json
